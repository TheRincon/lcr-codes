[alias]
# The cargo-xtask convention: automation that needs the project's own types lives in a
# plain Rust binary rather than a shell script. `capacity` recomputes the §6.1 table from
# `lcr_core::capacity` instead of restating it, and `ldpc` generates the §8.2 base graphs,
# which the spec forbids building at runtime.
#
#   cargo xtask ldpc       regenerate the §8.2 LDPC base graphs
#   cargo xtask capacity   recompute the §6.1 capacity table
#
# Shell-shaped automation — component builds, size gates, artifact generation — lives in
# the justfile instead, which also wraps these two so `just --list` is the single front
# door. See the note at the top of that file for where the line sits.
xtask = "run --release --package xtask --"
