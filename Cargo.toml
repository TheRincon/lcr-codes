[workspace]
resolver = "2"
members = [
    "crates/lcr-cft",
    "crates/lcr-core",
    "crates/lcr-decode",
    "crates/lcr-encode",
    "crates/lcr-render",
    "crates/lcr-verify",
    "crates/lcr-wasm",
    "crates/lcr-ffi",
    "crates/lcr-cli",
    "xtask",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0 OR Unlicense"
repository = "https://github.com/TheRincon/lcr-codes"
authors = ["LCR Code contributors"]

[workspace.dependencies]
lcr-core   = { path = "crates/lcr-core",   version = "0.4.0", default-features = false }
lcr-cft    = { path = "crates/lcr-cft",    version = "0.4.0", default-features = false }
lcr-decode = { path = "crates/lcr-decode", version = "0.4.0", default-features = false }
lcr-encode = { path = "crates/lcr-encode", version = "0.4.0", default-features = false }
lcr-render = { path = "crates/lcr-render", version = "0.4.0", default-features = false }
lcr-verify = { path = "crates/lcr-verify", version = "0.4.0", default-features = false }

miniz_oxide   = { version = "0.9", default-features = false, features = ["with-alloc"] }
# QR generation for §17.2 dual-render, behind `lcr-render/qr`. Pure Rust, zero
# dependencies. A library rather than something written here: LCR Code has no business
# implementing a second symbology, and a hand-rolled QR encoder's masking and interleaving
# are not provable without a decoder.
qrcodegen     = { version = "1.8" }
# QR decoder. Tests only, so a dual-render is verified rather than asserted.
# `default-features = false` drops `image`, which §14.2 gates out of the wasm path.
rqrr          = { version = "0.11", default-features = false }
p256          = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "pkcs8", "alloc"] }
ed25519-dalek = { version = "2",    default-features = false, features = ["pkcs8", "alloc"] }
# §10.5 derives `kid` from SHA-256 over the DER public key. Pure Rust, no_std.
sha2          = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Size-tuned profile used for the wasm scanner bundle (§14.2).
[profile.wasm-min]
inherits = "release"
opt-level = "z"
strip = true
