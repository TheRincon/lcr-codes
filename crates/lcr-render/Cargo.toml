[package]
name = "lcr-render"
description = "LCR Code renderers: RGB raster, PNG, compact SVG and one-page GDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "svg", "png", "gdf", "lcr-code"]
categories = ["encoding", "multimedia::images", "rendering"]

[features]
default = ["std", "png"]
std = ["lcr-core/std"]
png = ["dep:miniz_oxide"]
# §17.2 dual-render: an LCR symbol beside a QR carrying a fallback URL, composed into one
# image at a shared module pitch.
#
# **Off by default, deliberately.** `lcr-render` is in the wasm full build, and QR costs
# ~23 KB there for a capability most callers do not want. It is also, in §17.2's own words,
# "a bridge, not an answer" — it reintroduces the network dependency the format exists to
# remove — so it should be something a deployment opts into rather than something it gets
# for linking the renderer.
qr = ["dep:qrcodegen"]

[dependencies]
lcr-core = { workspace = true }
miniz_oxide = { workspace = true, optional = true }
qrcodegen = { workspace = true, optional = true }

[dev-dependencies]
lcr-encode = { path = "../lcr-encode", default-features = false }
lcr-decode = { path = "../lcr-decode", default-features = false }
rqrr = { workspace = true }

# docs.rs: document the QR module too, which is off by default (see `qr` above).
[package.metadata.docs.rs]
all-features = true
