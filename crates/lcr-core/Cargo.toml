[package]
name = "lcr-core"
description = "LCR Code core: geometry, palette, LDPC error correction, framing and masking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "2d-barcode", "color", "matrix-code", "lcr-code"]
categories = ["encoding", "multimedia::images"]

[features]
default = ["std", "deflate"]
std = []
# DEFLATE for §9.3 cflag 01. Pure Rust (miniz_oxide), so it stays in the wasm bundle.
deflate = ["dep:miniz_oxide"]
# Brotli for §9.3 cflag 10. Off by default: it roughly doubles the container code size
# and §9.3 itself notes it rarely wins at LCR Code payload sizes.
brotli = ["dep:brotli"]

[dependencies]
miniz_oxide = { workspace = true, optional = true }
brotli = { version = "7", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
