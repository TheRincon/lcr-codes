[package]
name = "lc-encode"
description = "LC Code encoder: framing, compression, ECC, masking, colourisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "deflate", "sign"]
std = ["lc-core/std"]
deflate = ["lc-core/deflate"]
brotli = ["lc-core/brotli"]
# §10 issuing. Shares lc-verify's COSE/CWT serialisers so the two ends cannot drift.
# `lc-verify` is pulled without its `decode` feature: an issuer has no decoder.
sign = ["dep:lc-verify", "dep:ed25519-dalek", "dep:p256"]

[dependencies]
lc-core = { workspace = true }
lc-verify = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "ed25519",
    "es256",
] }
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
