[package]
name = "lcr-ffi"
description = "C ABI for LCR Code: decode, encode, multi-frame combining and CBOR File Transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "ffi", "c-api", "2d-barcode", "lcr-code"]
categories = ["development-tools::ffi", "encoding"]

[lib]
# `staticlib` and `cdylib` are what a C host links; `rlib` lets the Rust tests in
# `tests/` call the exported functions directly, through the same ABI a C caller uses.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `lcr_cft_fountain_*` and `lcr_cft_receiver_pending` (docs/CFT.md §21). Off by default,
# like the WebAssembly side, where only the demo build carries it. In the header these sit
# behind `LCR_FOUNTAIN`: define it when linking a library built with this feature.
fountain = ["lcr-cft/fountain"]

[dependencies]
# Feature-for-feature what the `lcr-code` component carries, so a native host and a wasm
# host read and write exactly the same symbols and transfers.
lcr-core = { workspace = true, features = ["std", "deflate"] }
lcr-decode = { workspace = true, features = ["std", "deflate"] }
lcr-encode = { workspace = true, features = ["std", "deflate"] }
lcr-render = { workspace = true, features = ["std"] }
# Zstandard to send, like the component, so a transfer written here is readable by the
# browser build. Deflate as well, to receive what a 0.4 sender wrote; the manifest names the
# codec.
lcr-cft = { workspace = true, features = ["std", "zstd", "deflate"] }
