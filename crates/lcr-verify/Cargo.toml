[package]
name = "lcr-verify"
description = "LCR Code signed packets: COSE_Sign1, CWT claims, and offline verification (§10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "cose", "cwt", "signature", "lcr-code"]
categories = ["cryptography", "encoding"]

[features]
default = ["std", "ed25519", "es256", "decode"]
std = ["lcr-core/std"]
# §10.3 requires verifiers to implement both. They are separable only so that a
# deployment which controls both ends can drop one; doing so makes the build
# non-conformant, which is why both are on by default.
ed25519 = ["dep:ed25519-dalek"]
es256 = ["dep:p256"]
# The `lcr_decode::PacketVerifier` impl. Off means this crate can verify a COSE blob
# from anywhere without pulling in the decoder.
decode = ["dep:lcr-decode"]

[dependencies]
lcr-core = { workspace = true }
lcr-decode = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true }

[dev-dependencies]
lcr-decode = { path = "../lcr-decode", default-features = false }
lcr-encode = { path = "../lcr-encode", default-features = false, features = ["std", "deflate", "sign"] }
lcr-render = { path = "../lcr-render", default-features = false }
sha2 = { workspace = true }
