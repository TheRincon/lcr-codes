[package]
name = "lcr-cli"
description = "The `lcr` command: encode, decode, probe and transfer files as LCR Code symbols"
version.workspace = true
edition.workspace = true
# Above the workspace's 1.94, and only here: `avif-decode` needs 1.98. The libraries keep
# the lower floor; a user who needs the CLI on an older toolchain can build it with
# `--no-default-features --features png,jpeg,webp,jxl`.
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "cli", "2d-barcode", "decoder", "lcr-code"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "lcr"
path = "src/main.rs"

[features]
# Every image format `lcr decode` can read is a feature, all on by default, so a build
# that needs a smaller tree — or has no assembler for AVIF — can drop what it does not use.
# A format is detected from the file's leading bytes, never its extension.
default = ["png", "jpeg", "webp", "jxl", "avif"]
png = ["dep:png"]
jpeg = ["dep:zune-jpeg"]
webp = ["dep:image-webp"]
jxl = ["dep:jxl-oxide"]
# AV1 still images, through `rav1d` (a Rust port of dav1d). On x86 and x86_64 `rav1d`
# turns on its hand-written assembly, which needs `nasm` at build time; on ARM it is pure
# Rust. See README.md.
avif = ["dep:avif-decode"]

[dependencies]
lcr-core = { workspace = true, features = ["std", "deflate"] }
lcr-decode = { workspace = true, features = ["std", "deflate"] }
lcr-encode = { workspace = true, features = ["std", "deflate"] }
lcr-render = { workspace = true, features = ["std", "png"] }
# Deflate only, like lcr-ffi and the component, so a transfer sent from the command line
# can be received by the browser demo and vice versa.
lcr-cft = { workspace = true, features = ["std", "deflate"] }

clap = { version = "4.6", features = ["derive"] }

# Image decoders. Pure Rust throughout (see `avif` above for the one build-time caveat).
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", optional = true }
image-webp = { version = "0.2", optional = true }
jxl-oxide = { version = "0.12", optional = true, default-features = false }
avif-decode = { version = "3", optional = true, default-features = false }
