[package]
name = "lcr-decode"
description = "LCR Code decoder: detection, sampling, illumination fit, soft demodulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["barcode", "2d-barcode", "decoder", "scanner", "lcr-code"]
categories = ["encoding", "multimedia::images"]

[features]
default = ["std", "deflate"]
std = ["lcr-core/std"]
deflate = ["lcr-core/deflate"]
brotli = ["lcr-core/brotli"]

[dependencies]
lcr-core = { workspace = true }

[dev-dependencies]
lcr-encode = { path = "../lcr-encode", default-features = false }
# `png` only here: the examples write PNG figures, and a dev-dependency cannot reach the
# scanner bundle §14.1 keeps thin.
lcr-render = { path = "../lcr-render", default-features = false, features = ["png", "qr"] }
