[package]
name = "lc-verify"
description = "LC Code signed packets: COSE_Sign1, CWT claims, and offline verification (§10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "ed25519", "es256", "decode"]
std = ["lc-core/std"]
# §10.3 requires verifiers to implement both. They are separable only so that a
# deployment which controls both ends can drop one; doing so makes the build
# non-conformant, which is why both are on by default.
ed25519 = ["dep:ed25519-dalek"]
es256 = ["dep:p256"]
# The `lc_decode::PacketVerifier` impl. Off means this crate can verify a COSE blob
# from anywhere without pulling in the decoder.
decode = ["dep:lc-decode"]

[dependencies]
lc-core = { workspace = true }
lc-decode = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true }

[dev-dependencies]
lc-decode = { workspace = true }
lc-encode = { workspace = true, features = ["std", "deflate", "sign"] }
lc-render = { workspace = true }
sha2 = { workspace = true }
