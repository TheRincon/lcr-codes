[package]
name = "lcr-cft"
description = "CFT, CBOR File Transfer: chunked, hash-verified file transfer over any carrier, LCR Code included"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["file-transfer", "cbor", "chunking", "barcode", "lcr-code"]
categories = ["encoding", "compression"]

[features]
default = ["std", "zstd"]
std = ["lcr-core/std"]
# Zstandard via the reference C library. CFT.md makes this the preferred codec and the
# project grants it an explicit exception to §14.2's no-C rule — but the exception is
# scoped: `lcr-wasm` must not enable it, because zstd-sys cannot build for
# wasm32-unknown-unknown. See the note in `codec.rs`.
zstd = ["dep:zstd", "std"]
deflate = ["dep:miniz_oxide"]
brotli = ["lcr-core/brotli"]
# Fountain repair symbols (docs/CFT.md §21): a one-way carousel any slightly-more-than-all
# of whose frames rebuild the file. Off by default — a plain transfer, where a receiver
# can name what it missed, is what most carriers want, and this is the demo's illustration
# of the other kind. Without it a receiver rejects repair symbols, as any pre-§21 one does.
fountain = []

[dependencies]
lcr-core = { workspace = true }
sha2 = { workspace = true }
zstd = { version = "0.13", optional = true }
miniz_oxide = { workspace = true, optional = true }

[[test]]
name = "fountain"
required-features = ["fountain"]

[dev-dependencies]
lcr-core = { path = "../lcr-core", default-features = false, features = ["std", "deflate"] }
lcr-decode = { path = "../lcr-decode", default-features = false, features = ["std", "deflate"] }
lcr-encode = { path = "../lcr-encode", default-features = false, features = ["std", "deflate"] }
lcr-render = { path = "../lcr-render", default-features = false }
